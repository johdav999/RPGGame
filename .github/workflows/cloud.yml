name: Cloud headless
on:
  push:
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  headless:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install build prerequisites
        run: sudo apt-get update && sudo apt-get install -y build-essential cmake ninja-build
      - name: Build and test the cloud development path
        run: bash scripts/setup-cloud.sh
